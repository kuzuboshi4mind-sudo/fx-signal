name: FX bot

on:
  schedule:
    # 15分ごとに起動を試みる（混雑する00分を避ける）。1回の起動で約5時間40分、15分ごとに回し続けるので、
    # 起動が遅れたり飛ばされたりしても止まりにくい。実行中に来た起動は待機し、終わったらすぐ次が始まる
    # （2026-11-09：GitHub の定期起動が7〜10時間あくことがあり、55分では大半の時間を取りこぼしたため延長）
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      reset:
        description: '仮想口座をリセットして最初から運用する'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fx-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 運用データは bot-data ブランチに保存（main を汚さず、Pages の再ビルドも起こさない）
      - name: Prepare data branch
        run: |
          if git ls-remote --exit-code origin bot-data >/dev/null; then
            git fetch --depth 1 origin bot-data:bot-data
            git worktree add data bot-data
          else
            git worktree add --orphan -b bot-data data
          fi

      - name: Run bot (about 5h40m, every 15 minutes)
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          RESET: ${{ inputs.reset }}
        # 通貨ペアごとに順番に実行し、毎回 bot-data に保存する（1つ失敗しても他は続ける）
        run: bash bot/loop.sh 340
        shell: bash
